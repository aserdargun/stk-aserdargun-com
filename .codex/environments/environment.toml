version = 1
name = "stackfolio"

[setup]
script = """
npm ci

if [ ! -f api/local.settings.json ]; then
  cp api/local.settings.example.json api/local.settings.json
fi

if ! command -v func >/dev/null 2>&1; then
  npm install -g azure-functions-core-tools@4.13.0 --unsafe-perm true
fi

npm run build
"""

[[actions]]
name = "Full App"
icon = "run"
command = """
set -e
mkdir -p .azure/azurite
azurite_pid=""
cleanup() {
  if [ -n "${azurite_pid:-}" ]; then
    kill "$azurite_pid" 2>/dev/null || true
    wait "$azurite_pid" 2>/dev/null || true
  fi
}
trap cleanup EXIT INT TERM
npx --yes azurite@3.36.0 --silent --location .azure/azurite --debug .azure/azurite-debug.log &
azurite_pid=$!
npm run build
npx --yes @azure/static-web-apps-cli@2.0.10 start dist --api-devserver-url http://127.0.0.1:7071 --run 'node tools/full-app-api-proxy.mjs' --swa-config-location public
"""

[[actions]]
name = "Frontend"
icon = "run"
command = "npm run dev"

[[actions]]
name = "Validate"
icon = "tool"
command = "npm run typecheck && npm test && npm run build && git diff --check"

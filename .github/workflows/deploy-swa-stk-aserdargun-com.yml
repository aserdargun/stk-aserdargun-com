name: Deploy Stackfolio to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-stk-aserdargun-com-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and build
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run build:api:artifact
          test -s dist/index.html
          test -s api-dist/host.json
          test -s api-dist/package.json
          test -d api-dist/node_modules/@azure/functions

      - name: Deploy prebuilt application
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_STK_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          api_location: api-dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true

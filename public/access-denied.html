<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Private access · Stackfolio</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; color: #111827; background: #f5f7fb; }
      main { width: min(420px, calc(100% - 48px)); padding: 36px; text-align: center; border: 1px solid #dfe6ef; border-radius: 18px; background: white; box-shadow: 0 20px 60px rgba(15, 23, 42, .09); }
      .eyebrow { color: #0284c7; font-size: 11px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
      h1 { margin: 10px 0; font-size: 28px; letter-spacing: -.7px; }
      p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }
      a { display: inline-flex; min-height: 42px; align-items: center; padding: 0 18px; color: #071827; font-weight: 800; text-decoration: none; border-radius: 11px; background: #38bdf8; }
      small { display: block; margin-top: 18px; color: #718096; font-size: 12px; line-height: 1.5; }
      @media (max-width: 620px) { main { width: min(100% - 32px, 420px); padding: 28px 22px; } a { min-height: 46px; } }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Private portfolio</span>
      <h1>Owner access required.</h1>
      <p>Stackfolio is available only to its authorized GitHub account.</p>
      <a href="/.auth/logout?post_logout_redirect_uri=https%3A%2F%2Fstackfolio.aserdargun.com%2Flogin">Sign out and switch account</a>
      <small>Only the authorized GitHub owner can open Stackfolio data.</small>
    </main>
  </body>
</html>

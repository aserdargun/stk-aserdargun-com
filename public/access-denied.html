<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Private access · Stackfolio</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; color: #111d35; background: radial-gradient(circle at 82% 0%, rgba(56,189,248,.2), transparent 30rem), linear-gradient(rgba(37,99,235,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,.035) 1px, transparent 1px), #f4f7fb; background-size: auto, 32px 32px, 32px 32px, auto; }
      main { width: min(420px, calc(100% - 48px)); padding: 36px; text-align: center; border: 1px solid #dce5f2; border-radius: 18px; background: rgba(255,255,255,.94); box-shadow: 0 20px 60px rgba(30,64,175,.12); }
      main::before { display: grid; width: 44px; height: 44px; margin: 0 auto 22px; place-items: center; color: white; font-size: 13px; font-weight: 900; letter-spacing: -.4px; border-radius: 12px; background: linear-gradient(145deg, #38bdf8, #4f46e5); box-shadow: 0 10px 26px rgba(37,99,235,.24); content: "AS"; }
      .eyebrow { color: #2563eb; font-size: 11px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
      h1 { margin: 10px 0; font-size: 28px; letter-spacing: -.7px; }
      p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }
      a { display: inline-flex; min-height: 42px; align-items: center; padding: 0 18px; color: white; font-weight: 800; text-decoration: none; border-radius: 11px; background: linear-gradient(135deg, #2563eb, #4f46e5); box-shadow: 0 9px 24px rgba(37,99,235,.22); }
      small { display: block; margin-top: 18px; color: #74839a; font-size: 12px; line-height: 1.5; }
      @media (max-width: 620px) { main { width: min(100% - 32px, 420px); padding: 28px 22px; } a { min-height: 46px; } }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Private portfolio</span>
      <h1>Owner access required.</h1>
      <p>Stackfolio is available only to its authorized GitHub account.</p>
      <a href="/.auth/logout?post_logout_redirect_uri=https%3A%2F%2Fstackfolio.aserdargun.com%2Flogin">Sign out and switch account</a>
      <small>Only the authorized GitHub owner can open Stackfolio data.</small>
    </main>
  </body>
</html>
